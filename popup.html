<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>X Ad Closer</h1>
    <p class="subtitle">Auto-dismiss ads on X.com</p>

    <div class="toggle-row">
      <span class="toggle-label">Enabled</span>
      <label class="switch">
        <input type="checkbox" id="toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="stats">
      <span class="stats-label">This session</span>
      <span class="stats-value" id="count">0</span>
    </div>

    <div class="stats">
      <span class="stats-label">All time</span>
      <span class="stats-value" id="total">0</span>
    </div>

    <button id="reset" class="reset-btn">Reset counts</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
